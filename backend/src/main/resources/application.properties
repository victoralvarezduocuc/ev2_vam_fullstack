server.port=8081

# Muestra el motivo de los errores 400 (por ejemplo "Producto no existe") en la respuesta JSON.
server.error.include-message=always

# MongoDB local en Docker (ver docker-compose.yml en la raíz del proyecto).
# Para usar MongoDB Atlas u otra base, define la variable de entorno MONGODB_URI
# en lugar de editar este archivo, así la clave no queda guardada en GitHub.
spring.mongodb.uri=${MONGODB_URI:mongodb://gourmet_user:gourmet123@localhost:27017/gourmet?authSource=gourmet}
